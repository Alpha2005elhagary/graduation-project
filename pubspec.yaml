name: breakbot
description: "BreakBot - Arabic-first AI habit coach for Egypt."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Architecture & DI
  get_it: ^8.0.1

  # Navigation
  go_router: ^14.2.1

  # Local storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Device capabilities
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.0

  # Localisation & RTL
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Functional programming
  either_dart: ^1.0.0
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  logger: ^2.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_intl:
  enabled: true
